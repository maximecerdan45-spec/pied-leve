<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Pied Levé · Moderne · Bilan</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E1418; font-family: Manrope, sans-serif; color: #E8F0EC; padding: 60px 16px 28px; display: flex; flex-direction: column; gap: 14px">
  <div style="font-size: 14px; color: #8FA3AE; font-weight: 600">Trajet terminé · 12 km · 18 min</div>
  <div style="border-radius: 28px; padding: 26px 22px; background: radial-gradient(120% 120% at 0% 0%, #1F3B33 0%, #172129 60%); border: 1px solid #26343E; display: flex; align-items: center; gap: 20px">
    <div style="width: 104px; height: 104px; border-radius: 50%; background: conic-gradient(#4BE3A4 0 92%, #26343E 92% 100%); display: grid; place-items: center; flex: none">
      <div style="width: 84px; height: 84px; border-radius: 50%; background: #172129; display: grid; place-items: center; font: 800 34px Manrope, sans-serif">92</div>
    </div>
    <div>
      <div style="font: 800 24px/1.1 Manrope, sans-serif">Pied de velours</div>
      <div style="font-size: 14px; color: #8FA3AE; margin-top: 6px">Votre meilleure note cette semaine</div>
    </div>
  </div>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
    <div style="border-radius: 22px; background: #172129; border: 1px solid #26343E; padding: 18px">
      <div style="font-size: 13px; color: #8FA3AE">Économisé</div>
      <div style="font: 800 30px/1.1 Manrope, sans-serif; color: #4BE3A4">0,24 €</div>
      <div style="font-size: 12px; color: #8FA3AE">0,13 L</div>
    </div>
    <div style="border-radius: 22px; background: #172129; border: 1px solid #26343E; padding: 18px">
      <div style="font-size: 13px; color: #8FA3AE">Conseils suivis</div>
      <div style="font: 800 30px/1.1 Manrope, sans-serif">7/8</div>
      <div style="height: 5px; border-radius: 3px; background: #26343E; margin-top: 8px"><div style="width: 88%; height: 100%; border-radius: 3px; background: #4BE3A4"></div></div>
    </div>
  </div>
  <div style="border-radius: 22px; background: #172129; border: 1px solid #26343E; padding: 16px 18px; display: flex; align-items: center; gap: 14px">
    <div style="width: 48px; height: 48px; border-radius: 16px; background: linear-gradient(135deg,#FF9F43,#FF5A5F); display: grid; place-items: center"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="#0E1418"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.5L12 17.2l-5.9 3.2 1.3-6.5L2.5 9.3l6.6-.8z"/></svg></div>
    <div><div style="font-size: 12px; color: #FFB877; font-weight: 700; letter-spacing: .06em">NOUVEAU BADGE</div><div style="font: 800 18px Manrope, sans-serif">Roi du rond-point</div></div>
  </div>
  <div style="flex: 1"></div>
  <button style="height: 58px; border: 1px solid #26343E; border-radius: 18px; background: transparent; color: #E8F0EC; font: 700 16px Manrope, sans-serif; cursor: pointer">Voir le détail</button>
  <button style="height: 60px; border: 0; border-radius: 18px; background: #4BE3A4; color: #0E1418; font: 800 19px Manrope, sans-serif; cursor: pointer">Terminer</button>
</div>
</body>
</html>
