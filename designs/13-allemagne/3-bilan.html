<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Pied Levé · Allemagne · Bilan</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F4F2; font-family: 'Archivo Narrow', sans-serif; color: #111111; padding: 52px 18px 24px; display: flex; flex-direction: column; gap: 14px">
  <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #111111; padding-bottom: 10px">
    <div style="font: 700 26px 'Archivo Narrow', sans-serif">Rapport de trajet</div>
    <div style="background: #FFCC00; border: 2px solid #111111; padding: 4px 10px; font: 700 18px 'Archivo Narrow', sans-serif">A+</div>
  </div>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <div style="border: 2px solid #111111; padding: 12px"><div style="font-size: 13px; font-weight: 600">Efficacité</div><div style="font: 700 38px/1.1 'Archivo Narrow', sans-serif">94 %</div></div>
    <div style="border: 2px solid #111111; padding: 12px"><div style="font-size: 13px; font-weight: 600">Économie</div><div style="font: 700 38px/1.1 'Archivo Narrow', sans-serif">0,24 €</div></div>
  </div>
  <div style="border: 2px solid #111111; padding: 14px">
    <div style="font-size: 13px; font-weight: 600">Vitesse par rapport à la cible, par obstacle</div>
    <div style="display: flex; align-items: flex-end; gap: 8px; height: 120px; margin-top: 12px; border-bottom: 2px solid #111111">
      <i style="flex: 1; height: 62%; background: #111111"></i><i style="flex: 1; height: 55%; background: #111111"></i><i style="flex: 1; height: 88%; background: #E03131"></i><i style="flex: 1; height: 58%; background: #111111"></i><i style="flex: 1; height: 50%; background: #111111"></i><i style="flex: 1; height: 61%; background: #111111"></i><i style="flex: 1; height: 57%; background: #111111"></i><i style="flex: 1; height: 54%; background: #111111"></i>
    </div>
    <div style="position: relative; height: 0"><div style="position: absolute; left: 0; right: 0; top: -84px; border-top: 2px dashed #FFCC00"></div></div>
    <div style="font-size: 13px; margin-top: 8px">7 obstacles sur 8 passés à la bonne vitesse · ligne jaune : cible</div>
  </div>
  <div style="display: flex; flex-direction: column">
    <div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #C9C9C4"><span>Consommation estimée</span><b>5,1 L / 100 km</b></div>
    <div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #C9C9C4"><span>Distance en roue libre</span><b>2,4 km</b></div>
    <div style="display: flex; justify-content: space-between; padding: 10px 0"><span>Freinages forts</span><b>0</b></div>
  </div>
  <div style="flex: 1"></div>
  <button style="height: 58px; border: 0; background: #111111; color: #FFCC00; font: 700 19px 'Archivo Narrow', sans-serif; letter-spacing: .06em; cursor: pointer">TERMINER</button>
</div>
</body>
</html>
