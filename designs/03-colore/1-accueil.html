<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Pied Levé · Coloré · Accueil</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF4DE; font-family: Nunito, sans-serif; color: #2B2140; padding: 52px 18px 28px; display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; gap: 10px">
    <label style="flex: 1; display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 16px; border-radius: 20px; background: #FFFFFF; border: 3px solid #2B2140; box-shadow: 0 4px 0 #2B2140">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2B2140" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input type="search" placeholder="Où on va ?" aria-label="Destination" style="border: 0; outline: 0; background: transparent; font: 700 17px Nunito, sans-serif; color: #2B2140; flex: 1; min-width: 0">
    </label>
    <button aria-label="Menu" style="width: 56px; height: 56px; border-radius: 20px; background: #6C5CE7; border: 3px solid #2B2140; box-shadow: 0 4px 0 #2B2140; display: grid; place-items: center; cursor: pointer"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
  <div style="border-radius: 28px; background: #FFC93C; border: 3px solid #2B2140; box-shadow: 0 6px 0 #2B2140; padding: 22px; display: flex; gap: 16px; align-items: center">
    <svg aria-hidden="true" width="92" height="92" viewBox="0 0 92 92">
      <ellipse cx="46" cy="58" rx="30" ry="26" fill="#FF8A65" stroke="#2B2140" stroke-width="3"/>
      <circle cx="22" cy="28" r="8" fill="#FF8A65" stroke="#2B2140" stroke-width="3"/>
      <circle cx="38" cy="20" r="8" fill="#FF8A65" stroke="#2B2140" stroke-width="3"/>
      <circle cx="55" cy="20" r="8" fill="#FF8A65" stroke="#2B2140" stroke-width="3"/>
      <circle cx="70" cy="28" r="7" fill="#FF8A65" stroke="#2B2140" stroke-width="3"/>
      <circle cx="37" cy="54" r="4" fill="#2B2140"/><circle cx="55" cy="54" r="4" fill="#2B2140"/>
      <path d="M36 66 Q46 75 56 66" stroke="#2B2140" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    </svg>
    <div>
      <div style="font: 800 30px/1 'Baloo 2', sans-serif">Pied Levé</div>
      <div style="font-weight: 700; font-size: 15px; margin-top: 4px">Prêt à rouler léger ?</div>
    </div>
  </div>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
    <div style="border-radius: 24px; background: #1FB5A3; border: 3px solid #2B2140; box-shadow: 0 5px 0 #2B2140; padding: 16px; color: #FFFFFF">
      <div style="font-weight: 800; font-size: 13px; opacity: .95">CE MOIS-CI</div>
      <div style="font: 800 34px/1.1 'Baloo 2', sans-serif">1,62 €</div>
    </div>
    <div style="border-radius: 24px; background: #FF6B5A; border: 3px solid #2B2140; box-shadow: 0 5px 0 #2B2140; padding: 16px; color: #FFFFFF">
      <div style="font-weight: 800; font-size: 13px; opacity: .95">SÉRIE</div>
      <div style="font: 800 34px/1.1 'Baloo 2', sans-serif">3 jours</div>
    </div>
  </div>
  <div style="border-radius: 22px; background: #FFFFFF; border: 3px solid #2B2140; padding: 14px 16px">
    <div style="display: flex; justify-content: space-between; font-weight: 800; font-size: 15px"><span>Prochain cadeau : petit-déj</span><span>58 %</span></div>
    <div style="height: 14px; border-radius: 7px; background: #F1E6FF; border: 2px solid #2B2140; margin-top: 10px; overflow: hidden"><div style="width: 58%; height: 100%; background: #6C5CE7"></div></div>
  </div>
  <div style="flex: 1"></div>
  <button style="height: 68px; border-radius: 24px; background: #1FB5A3; border: 3px solid #2B2140; box-shadow: 0 6px 0 #2B2140; color: #FFFFFF; font: 800 26px 'Baloo 2', sans-serif; cursor: pointer">C’est parti !</button>
</div>
</body>
</html>
