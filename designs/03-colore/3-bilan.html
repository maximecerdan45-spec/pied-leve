<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Pied Levé · Coloré · Bilan</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #6C5CE7; font-family: Nunito, sans-serif; color: #2B2140; padding: 52px 18px 28px; display: flex; flex-direction: column; gap: 14px">
  <div style="text-align: center; color: #FFFFFF">
    <div style="display: flex; justify-content: center; gap: 6px">
      <svg aria-hidden="true" width="56" height="56" viewBox="0 0 24 24" fill="#FFC93C" stroke="#2B2140" stroke-width="1.2" stroke-linejoin="round"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.5L12 17.2l-5.9 3.2 1.3-6.5L2.5 9.3l6.6-.8z"/></svg>
      <svg aria-hidden="true" width="68" height="68" viewBox="0 0 24 24" fill="#FFC93C" stroke="#2B2140" stroke-width="1.2" stroke-linejoin="round" style="margin-top: -10px"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.5L12 17.2l-5.9 3.2 1.3-6.5L2.5 9.3l6.6-.8z"/></svg>
      <svg aria-hidden="true" width="56" height="56" viewBox="0 0 24 24" fill="#FFC93C" stroke="#2B2140" stroke-width="1.2" stroke-linejoin="round"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.5L12 17.2l-5.9 3.2 1.3-6.5L2.5 9.3l6.6-.8z"/></svg>
    </div>
    <div style="font: 800 44px/1 'Baloo 2', sans-serif; margin-top: 10px">Pied de velours !</div>
    <div style="font-weight: 800; font-size: 16px; margin-top: 4px; opacity: .95">92 points · 12 km · 18 min</div>
  </div>
  <div style="border-radius: 28px; background: #FFC93C; border: 3px solid #2B2140; box-shadow: 0 6px 0 #2B2140; padding: 20px; text-align: center">
    <div style="font-weight: 800; font-size: 14px">TU AS ÉCONOMISÉ</div>
    <div style="font: 800 58px/1 'Baloo 2', sans-serif">0,24 €</div>
    <div style="font-weight: 700; font-size: 14px">plus que 2,12 € avant ton petit-déj offert</div>
  </div>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
    <div style="border-radius: 22px; background: #FFFFFF; border: 3px solid #2B2140; padding: 14px">
      <div style="font-weight: 800; font-size: 13px">CONSEILS SUIVIS</div>
      <div style="font: 800 30px/1.1 'Baloo 2', sans-serif; color: #1FB5A3">7 / 8</div>
    </div>
    <div style="border-radius: 22px; background: #FFFFFF; border: 3px solid #2B2140; padding: 14px">
      <div style="font-weight: 800; font-size: 13px">FREINAGES FORTS</div>
      <div style="font: 800 30px/1.1 'Baloo 2', sans-serif; color: #FF6B5A">0</div>
    </div>
  </div>
  <div style="border-radius: 24px; background: #1FB5A3; border: 3px solid #2B2140; box-shadow: 0 5px 0 #2B2140; padding: 14px 16px; display: flex; align-items: center; gap: 14px; color: #FFFFFF">
    <div style="width: 54px; height: 54px; border-radius: 50%; background: #FFC93C; border: 3px solid #2B2140; display: grid; place-items: center; flex: none"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2B2140" stroke-width="2.6"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="#2B2140"/></svg></div>
    <div><div style="font-weight: 800; font-size: 13px">BADGE DÉBLOQUÉ</div><div style="font: 800 22px/1.1 'Baloo 2', sans-serif">Roi du rond-point</div></div>
  </div>
  <div style="flex: 1"></div>
  <button style="height: 64px; border-radius: 24px; background: #FFFFFF; border: 3px solid #2B2140; box-shadow: 0 6px 0 #2B2140; color: #2B2140; font: 800 24px 'Baloo 2', sans-serif; cursor: pointer">Super, merci !</button>
</div>
</body>
</html>
