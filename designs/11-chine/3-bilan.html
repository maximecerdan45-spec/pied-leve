<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Pied Levé · Chine · Bilan</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F7; font-family: 'Noto Sans', sans-serif; color: #1D2129; padding: 48px 16px 22px; display: flex; flex-direction: column; gap: 12px">
  <div style="position: relative; height: 330px; border-radius: 22px; background: #E8222C; overflow: hidden; color: #FFE8A3; text-align: center">
    <div style="position: absolute; left: -40px; right: -40px; top: -210px; height: 360px; border-radius: 50%; background: #D11A24"></div>
    <div style="position: absolute; left: 50%; top: 116px; width: 84px; height: 84px; margin-left: -42px; border-radius: 50%; background: #FFCF5C; color: #B5121B; display: grid; place-items: center; font: 800 26px 'Noto Sans', sans-serif; box-shadow: 0 4px 0 #C99A2E">€</div>
    <div style="position: absolute; left: 0; right: 0; top: 34px; font: 800 18px 'Noto Sans', sans-serif">Enveloppe du trajet</div>
    <div style="position: absolute; left: 0; right: 0; bottom: 30px">
      <div style="font: 800 54px/1 'Noto Sans', sans-serif">0,24 €</div>
      <div style="font-size: 14px; margin-top: 6px">ajoutés à votre cagnotte · 1,86 € ce mois</div>
    </div>
  </div>
  <div style="border-radius: 18px; background: #FFFFFF; padding: 14px 16px">
    <div style="display: flex; justify-content: space-between; font-weight: 800"><span>Pointage quotidien</span><span style="color: #E8222C">4 jours</span></div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-top: 10px; text-align: center; font-size: 12px">
      <div style="border-radius: 10px; background: #FFF1F0; color: #E8222C; padding: 6px 0; font-weight: 800">L ✓</div><div style="border-radius: 10px; background: #FFF1F0; color: #E8222C; padding: 6px 0; font-weight: 800">M ✓</div><div style="border-radius: 10px; background: #FFF1F0; color: #E8222C; padding: 6px 0; font-weight: 800">M ✓</div><div style="border-radius: 10px; background: #E8222C; color: #FFFFFF; padding: 6px 0; font-weight: 800">J ✓</div><div style="border-radius: 10px; background: #F2F3F5; padding: 6px 0">V</div><div style="border-radius: 10px; background: #F2F3F5; padding: 6px 0">S</div><div style="border-radius: 10px; background: #F2F3F5; padding: 6px 0">D</div>
    </div>
  </div>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; text-align: center">
    <div style="border-radius: 16px; background: #FFFFFF; padding: 12px 0"><div style="font: 800 22px 'Noto Sans', sans-serif">92</div><div style="font-size: 12px; color: #86909C">score</div></div>
    <div style="border-radius: 16px; background: #FFFFFF; padding: 12px 0"><div style="font: 800 22px 'Noto Sans', sans-serif">7/8</div><div style="font-size: 12px; color: #86909C">conseils</div></div>
    <div style="border-radius: 16px; background: #FFFFFF; padding: 12px 0"><div style="font: 800 22px 'Noto Sans', sans-serif">Top 15 %</div><div style="font-size: 12px; color: #86909C">à Nantes</div></div>
  </div>
  <div style="flex: 1"></div>
  <button style="height: 58px; border: 0; border-radius: 29px; background: linear-gradient(90deg,#FF6A3D,#E8222C); color: #FFFFFF; font: 800 18px 'Noto Sans', sans-serif; cursor: pointer">Encaisser dans la cagnotte</button>
</div>
</body>
</html>
