<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Pied Levé · Scandinave · Bilan</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #1B1D1F; font-family: 'IBM Plex Sans', sans-serif; color: #E9E7E2; padding: 60px 20px 30px; display: flex; flex-direction: column">
  <div style="font-size: 11px; letter-spacing: .18em; color: #9A9893">TRAJET · 12 KM · 18 MIN</div>
  <div style="display: flex; align-items: flex-end; gap: 14px; margin-top: 20px">
    <div style="font: 300 120px/0.85 'IBM Plex Sans', sans-serif; letter-spacing: -.04em">92</div>
    <div style="padding-bottom: 6px"><div style="font-size: 11px; letter-spacing: .14em; color: #9A9893">SCORE</div><div style="font-size: 16px">Pied de velours</div></div>
  </div>
  <svg aria-hidden="true" width="350" height="70" viewBox="0 0 350 70" style="margin-top: 28px">
    <path d="M0 50 L 40 44 L 80 48 L 120 30 L 160 34 L 200 22 L 240 26 L 280 14 L 320 18 L 350 8" fill="none" stroke="#FF7500" stroke-width="2"/>
    <path d="M0 69 H350" stroke="#3A3E42"/>
  </svg>
  <div style="font-size: 12px; color: #9A9893; margin-top: 6px">Score des 10 derniers trajets</div>
  <div style="margin-top: 26px; border-top: 1px solid #3A3E42; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr))">
    <div style="padding: 16px 0; border-bottom: 1px solid #3A3E42; border-right: 1px solid #3A3E42"><div style="font-size: 11px; letter-spacing: .14em; color: #9A9893">ÉCONOMISÉ</div><div style="font: 300 30px 'IBM Plex Sans', sans-serif">0,24 €</div></div>
    <div style="padding: 16px; border-bottom: 1px solid #3A3E42"><div style="font-size: 11px; letter-spacing: .14em; color: #9A9893">CONSEILS</div><div style="font: 300 30px 'IBM Plex Sans', sans-serif">7/8</div></div>
    <div style="padding: 16px 0; border-bottom: 1px solid #3A3E42; border-right: 1px solid #3A3E42"><div style="font-size: 11px; letter-spacing: .14em; color: #9A9893">FREINAGES</div><div style="font: 300 30px 'IBM Plex Sans', sans-serif">0</div></div>
    <div style="padding: 16px; border-bottom: 1px solid #3A3E42"><div style="font-size: 11px; letter-spacing: .14em; color: #9A9893">BADGE</div><div style="font-size: 15px; margin-top: 8px; color: #FF7500">Roi du rond-point</div></div>
  </div>
  <div style="flex: 1"></div>
  <button style="height: 58px; border: 1px solid #E9E7E2; border-radius: 4px; background: transparent; color: #E9E7E2; font: 500 15px 'IBM Plex Sans', sans-serif; letter-spacing: .14em; cursor: pointer">TERMINER</button>
</div>
</body>
</html>
